[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-updater"
version = "0.1.0"
description = "Detect stale documentation by tracking code changes"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "networkx>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "pylint>=3.0",
]

[project.scripts]
doc-updater = "doc_updater.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=doc_updater --cov-report=term-missing"

[tool.coverage.run]
source = ["doc_updater"]

[tool.black]
line-length = 88
target-version = ["py312"]
